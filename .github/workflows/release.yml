name: Release

on:
  release:
    # published also covers prereleases published from drafts.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '27.0'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release version
        run: python3 scripts/release/macos-version.py env
      - name: Install dependencies and Rust targets
        run: |
          brew install scdoc
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test native architecture
        run: cargo test --locked --release --target=aarch64-apple-darwin
      - name: Build universal app
        run: make app-universal
      - name: Import Apple credentials
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release/macos-signing-setup.sh
      - name: Sign, notarize, staple, and verify
        run: bash scripts/release/macos-package.sh
      - name: Generate and sign Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/release/sparkle-appcast.sh
      - name: Upload signed downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
      - name: Remove Apple credentials
        if: always()
        run: bash scripts/release/macos-signing-cleanup.sh

  publish:
    if: github.event_name == 'release' && github.event.release.prerelease
    needs: [macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos
          path: dist
      - name: Verify checksums, attach assets, and promote to Latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/release/publish.sh
