# Converted from Ghostty's "Cobalt2" theme.
# Source: https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/ghostty/Cobalt2

[colors.primary]
background = "#132738"
foreground = "#ffffff"

[colors.cursor]
background = "#f0cc09"
foreground = "#98998c"

[colors.selection]
background = "#18354f"
foreground = "#b5b5b5"

[colors.normal]
black = "#000000"
red = "#ff0000"
green = "#38de21"
yellow = "#ffe50a"
blue = "#1460d2"
magenta = "#ff005d"
cyan = "#00bbbb"
white = "#bbbbbb"

[colors.bright]
black = "#555555"
red = "#f40e17"
green = "#3bd01d"
yellow = "#edc809"
blue = "#5555ff"
magenta = "#ff55ff"
cyan = "#6ae3fa"
white = "#ffffff"
