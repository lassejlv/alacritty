# Converted from Ghostty's "GitHub Light Default" theme.
# Source: https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/ghostty/GitHub%20Light%20Default

[colors.primary]
background = "#ffffff"
foreground = "#1f2328"

[colors.cursor]
background = "#0969da"
