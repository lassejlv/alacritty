image: archlinux

packages:
  - pkg-config
  - cmake
  - make
  - freetype2
  - fontconfig
  - libxcb
  - libxkbcommon
  - scdoc

sources:
  - https://github.com/lassejlv/alacritty

environment:
  PATH: /home/build/.cargo/bin:/usr/bin/

tasks:
  - rustup: |
      curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --profile minimal
  - rustfmt: |
      cd alacritty
      rustup toolchain install nightly -c rustfmt
      cargo +nightly fmt -- --check
  - man-pages: |
      cd alacritty
      cat docs/man/alacritty.1.scd | scdoc > /dev/null
      cat docs/man/alacritty-msg.1.scd | scdoc > /dev/null
      cat docs/man/alacritty.5.scd | scdoc > /dev/null
      cat docs/man/alacritty-bindings.5.scd | scdoc > /dev/null
  - test: |
      cd alacritty
      cargo test --locked --workspace
  - clippy: |
      cd alacritty
      rustup component add clippy
      cargo clippy --workspace --all-targets
  - feature-wayland: |
      cd alacritty/crates/alacritty
      RUSTFLAGS="-D warnings" cargo test --no-default-features --features=wayland
  - feature-x11: |
      cd alacritty/crates/alacritty
      RUSTFLAGS="-D warnings" cargo test --no-default-features --features=x11
