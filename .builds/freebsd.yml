image: freebsd/latest

packages:
  - devel/cmake
  - devel/pkgconf
  - lang/python3
  - print/freetype2
  - x11-fonts/fontconfig
  - x11-fonts/dejavu
  - x11/libxcb
  - x11/libxkbcommon

sources:
  - https://github.com/lassejlv/alacritty

environment:
  PATH: /home/build/.cargo/bin:/bin:/usr/bin:/usr/local/bin

tasks:
  - rustup: |
      curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --profile minimal
  - test: |
      cd alacritty
      cargo test --locked --workspace
  - clippy: |
      cd alacritty
      rustup component add clippy
      cargo clippy --workspace --all-targets
  - feature-wayland: |
      cd alacritty/crates/alacritty
      RUSTFLAGS="-D warnings" cargo test --no-default-features --features=wayland
  - feature-x11: |
      cd alacritty/crates/alacritty
      RUSTFLAGS="-D warnings" cargo test --no-default-features --features=x11
